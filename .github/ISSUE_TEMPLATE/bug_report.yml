name: Bug report
description: Report reproducible Yard Tracker behavior using fictional data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach household databases, exports, photos, addresses, ZIP codes, email addresses, credentials, backups, logs containing private data, or public deployment links.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior with fictional examples.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker Compose
        - Native macOS
        - Development
        - Other
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all household and credential data from this report.
          required: true
